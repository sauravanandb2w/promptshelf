services:
  - type: web
    name: promptshelf
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    disk: { name: data, mountPath: /var/data, sizeGB: 1 }
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: DB_PATH, value: /var/data/promptshelf.db }
      - { key: JWT_SECRET, generateValue: true }
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
