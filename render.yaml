services:
  - type: web
    name: promptshelf
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: JWT_SECRET, generateValue: true }
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
